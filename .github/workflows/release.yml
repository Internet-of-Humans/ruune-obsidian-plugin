# Cuts an Obsidian-compatible GitHub Release when you push a bare version tag.
#
# Obsidian's directory + BRAT require the release tag to EXACTLY match the
# `version` in manifest.json (e.g. 0.1.0 — no leading "v"), with manifest.json,
# main.js, and styles.css attached as individual assets. Obsidian only downloads
# those three; versions.json is read from the repo, so we do NOT attach it to
# the release (the directory scan flags extra assets).
#
# We also attach a build provenance attestation for main.js and styles.css so
# users can cryptographically verify they were built from this repo (improves
# the safety scorecard).
#
# Usage:
#   npm version patch|minor|major   # bumps package.json + manifest + versions.json
#   git push && git push --tags
name: Release Obsidian plugin

on:
  push:
    tags:
      # Bare semver only (0.1.0), so it matches manifest.json exactly.
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  # Required to generate build provenance attestations for the release asset.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match manifest.json version '$MANIFEST_VERSION'."
            echo "Obsidian requires the release tag to equal the manifest version exactly."
            exit 1
          fi

      - name: Attest build provenance for release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: create the release on first run, or refresh its assets
          # if the tag was re-pushed (so re-tagging never fails the workflow).
          # Only manifest.json + main.js + styles.css are attached — Obsidian
          # ignores anything else, and the directory scan flags extra files.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} exists — updating assets."
            gh release upload "${GITHUB_REF_NAME}" \
              manifest.json main.js styles.css --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              manifest.json main.js styles.css
          fi
